name: Deploy immutable release

on:
  workflow_run:
    workflows: [Agent quality gate]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged pull request number to deploy
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve trusted merge commit
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - name: Wait for verified PR merge
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PR_NUMBER}" ]]; then
            echo "The successful quality-gate run is not associated with a PR."
            exit 1
          fi

          for attempt in $(seq 1 30); do
            pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
            state="$(jq -r '.state' <<<"${pr}")"
            merged="$(jq -r '.merged' <<<"${pr}")"

            if [[ "${merged}" == "true" ]]; then
              base="$(jq -r '.base.ref' <<<"${pr}")"
              head_sha="$(jq -r '.head.sha' <<<"${pr}")"
              head_repository="$(jq -r '.head.repo.full_name' <<<"${pr}")"
              author="$(jq -r '.user.login' <<<"${pr}")"
              merge_sha="$(jq -r '.merge_commit_sha' <<<"${pr}")"

              [[ "${base}" == "main" ]]
              if [[ -n "${EXPECTED_HEAD_SHA}" ]]; then
                [[ "${head_sha}" == "${EXPECTED_HEAD_SHA}" ]]
              fi
              [[ "${head_repository}" == "${REPOSITORY}" ]]
              [[ "${author}" == "${REPOSITORY_OWNER}" ]]
              [[ "${merge_sha}" =~ ^[0-9a-f]{40}$ ]]

              echo "sha=${merge_sha}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            if [[ "${state}" == "closed" ]]; then
              echo "PR ${PR_NUMBER} closed without merging."
              exit 1
            fi
            sleep 10
          done

          echo "PR ${PR_NUMBER} was not merged within five minutes."
          exit 1

  build:
    name: Build verified release
    needs: resolve
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install "numpy>=2.0,<3" "PyJWT>=2.8,<3"

      - name: Run release gates
        run: |
          npx tailwindcss -c tailwind.config.js -i tailwind-src.css -o "${RUNNER_TEMP}/styles.css" --minify
          npx prisma validate --schema prisma/schema.prisma
          node --check public/chatbot.js
          python -m py_compile backend/rag_server_prisma.py backend/rag_storage_prisma.py backend/tenant_auth.py backend/rag_context.py backend/rag_contract.py backend/rag_evaluation.py
          python -m unittest discover -s tests -p "test_rag_storage_prisma_security.py" -v
          python -m unittest discover -s tests -p "test_tenant_ingestion_auth.py" -v
          python -m unittest discover -s tests -p "test_chunk_retrieval.py" -v
          python -m unittest discover -s tests -p "test_rag_contract.py" -v
          python -m unittest discover -s tests -p "test_deployment_contract.py" -v
          python -m unittest discover -s tests -p "test_public_beta_site.py" -v
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- ':!package-lock.json'; then
            echo "Unresolved merge conflict markers found."
            exit 1
          fi

      - name: Build commit-addressed artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="rag-chatbot-widget-${RELEASE_SHA}.tar.gz"
          git archive \
            --format=tar.gz \
            --output="${artifact}" \
            "${RELEASE_SHA}" \
            -- . \
            ':(exclude)backend/rag_database.db' \
            ':(exclude)prisma/prisma/rag_database.db'
          sha256sum "${artifact}" > "${artifact}.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.RELEASE_SHA }}
          path: |
            rag-chatbot-widget-${{ env.RELEASE_SHA }}.tar.gz
            rag-chatbot-widget-${{ env.RELEASE_SHA }}.tar.gz.sha256
          retention-days: 30
          if-no-files-found: error

  deploy:
    name: Deploy and verify
    needs: [resolve, build]
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
    - name: Download verified artifact
      uses: actions/download-artifact@v4
      with:
        name: release-${{ env.RELEASE_SHA }}

    - name: Configure SSH
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        printf '%s\n' "${{ secrets.ECS_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H "${{ secrets.ECS1_HOST }}" >> ~/.ssh/known_hosts

    - name: Copy release to ECS1
      run: |
        set -euo pipefail
        artifact="rag-chatbot-widget-${RELEASE_SHA}.tar.gz"
        scp "${artifact}" "${artifact}.sha256" \
          "${{ secrets.ECS_USER }}@${{ secrets.ECS1_HOST }}:/tmp/"

    - name: Activate release with rollback
      env:
        HEALTH_URL: ${{ secrets.ECS_HEALTH_URL }}
      run: |
        set -euo pipefail
        ssh "${{ secrets.ECS_USER }}@${{ secrets.ECS1_HOST }}" \
          "DEPLOY_SHA='${RELEASE_SHA}' HEALTH_URL='${HEALTH_URL}' bash -s" <<'EOF'
        set -euo pipefail

        app_root="/opt/rag-chatbot-widget"
        releases_root="/opt/rag-chatbot-widget-releases"
        data_root="/opt/rag-chatbot-widget-data"
        release_dir="${releases_root}/${DEPLOY_SHA}"
        artifact="/tmp/rag-chatbot-widget-${DEPLOY_SHA}.tar.gz"
        checksum="${artifact}.sha256"
        health_url="${HEALTH_URL:-http://127.0.0.1:8001/health/ready}"
        previous_target=""

        sudo mkdir -p "${releases_root}" "${data_root}"
        sudo chown "$USER:$USER" "${releases_root}" "${data_root}"
        cd /tmp
        sha256sum --check "${checksum}"

        if [ -L "${app_root}" ]; then
          previous_target="$(readlink -f "${app_root}")"
        elif [ -d "${app_root}" ]; then
          previous_target="${releases_root}/legacy-$(date -u +%Y%m%d%H%M%S)"
          if [ -f "${app_root}/backend/rag_database.db" ] && [ ! -f "${data_root}/rag_database.db" ]; then
            python3.10 - \
              "${app_root}/backend/rag_database.db" \
              "${data_root}/rag_database.db" <<'PY'
        import sqlite3
        import sys

        source = sqlite3.connect(sys.argv[1])
        destination = sqlite3.connect(sys.argv[2])
        try:
            source.backup(destination)
        finally:
            destination.close()
            source.close()
        PY
          fi
        fi

        if [ ! -f "${data_root}/rag_database.db" ]; then
          echo "Persistent production database was not found; refusing to deploy."
          exit 1
        fi

        mkdir -p "${release_dir}"
        tar -xzf "${artifact}" -C "${release_dir}"
        rm -f "${release_dir}/backend/rag_database.db"
        ln -s "${data_root}/rag_database.db" "${release_dir}/backend/rag_database.db"

        python3.10 -m venv "${release_dir}/backend/venv"
        "${release_dir}/backend/venv/bin/python" -m pip install \
          --disable-pip-version-check \
          -r "${release_dir}/backend/requirements.lock"

        rollback() {
          if [ -n "${previous_target}" ] && [ -e "${previous_target}" ]; then
            sudo ln -sfn "${previous_target}" "${app_root}.next"
            sudo mv -Tf "${app_root}.next" "${app_root}"
          fi
          sudo systemctl restart rag-backend
        }
        trap rollback ERR

        sudo systemctl stop rag-backend
        if [ -d "${app_root}" ] && [ ! -L "${app_root}" ]; then
          sudo mv "${app_root}" "${previous_target}"
          rm -f \
            "${previous_target}/backend/rag_database.db" \
            "${previous_target}/backend/rag_database.db-shm" \
            "${previous_target}/backend/rag_database.db-wal"
          ln -s \
            "${data_root}/rag_database.db" \
            "${previous_target}/backend/rag_database.db"
        fi

        sudo ln -sfn "${release_dir}" "${app_root}.next"
        sudo mv -Tf "${app_root}.next" "${app_root}"
        sudo systemctl restart rag-backend

        for attempt in $(seq 1 12); do
          if curl --fail --silent --show-error --max-time 10 "${health_url}" >/tmp/rag-readiness.json; then
            break
          fi
          if [ "${attempt}" -eq 12 ]; then
            echo "Readiness probe failed after deployment."
            exit 1
          fi
          sleep 5
        done

        curl --fail --silent --show-error --max-time 10 \
          "https://lingwenai.cn/chatbot.js" >/dev/null
        sudo systemctl is-active --quiet rag-backend
        trap - ERR
        echo "Deployed ${DEPLOY_SHA} and passed readiness checks."
        EOF