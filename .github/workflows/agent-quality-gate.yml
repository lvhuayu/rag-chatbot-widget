name: Agent quality gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Agent quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Verify CSS can be generated
        run: npx tailwindcss -c tailwind.config.js -i tailwind-src.css -o "${RUNNER_TEMP}/styles.css" --minify

      - name: Check JavaScript syntax
        run: node --check public/chatbot.js

      - name: Check Python syntax
        run: python -m py_compile backend/rag_server_prisma.py backend/rag_storage_prisma.py

      - name: Reject unresolved conflict markers
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- ':!package-lock.json'; then
            echo "Unresolved merge conflict markers found."
            exit 1
          fi
