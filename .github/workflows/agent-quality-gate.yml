name: Agent quality gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Agent quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Verify CSS can be generated
        run: npx tailwindcss -c tailwind.config.js -i tailwind-src.css -o "${RUNNER_TEMP}/styles.css" --minify

      - name: Validate Prisma schema
        run: npx prisma validate --schema prisma/schema.prisma

      - name: Check JavaScript syntax
        run: node --check public/chatbot.js

      - name: Check Python syntax
        run: python -m py_compile backend/rag_server_prisma.py backend/rag_storage_prisma.py backend/tenant_auth.py backend/rag_context.py backend/rag_contract.py backend/rag_evaluation.py

      - name: Run security regression tests
        run: |
          python -m pip install "numpy>=2.0,<3" "PyJWT>=2.8,<3"
          python -m unittest discover -s tests -p "test_rag_storage_prisma_security.py" -v
          python -m unittest discover -s tests -p "test_tenant_ingestion_auth.py" -v
          python -m unittest discover -s tests -p "test_chunk_retrieval.py" -v
          python -m unittest discover -s tests -p "test_rag_contract.py" -v
          python -m unittest discover -s tests -p "test_deployment_contract.py" -v

      - name: Reject unresolved conflict markers
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- ':!package-lock.json'; then
            echo "Unresolved merge conflict markers found."
            exit 1
          fi
