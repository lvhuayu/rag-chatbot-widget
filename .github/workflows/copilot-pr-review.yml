name: Copilot independent review

on:
  workflow_run:
    workflows: [Agent quality gate]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: copilot-review-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  dispatch-review:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Load pull request context
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          test -n "$PR_NUMBER" || {
            echo "No pull request is associated with this workflow run."
            exit 1
          }
          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          author="$(jq -r '.user.login' <<<"$pr_json")"
          if [ "$author" != "copilot-swe-agent[bot]" ]; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "dispatch=true" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r '.html_url' <<<"$pr_json")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.head.sha' <<<"$pr_json")" >> "$GITHUB_OUTPUT"
          echo "head_ref=$(jq -r '.head.ref' <<<"$pr_json")" >> "$GITHUB_OUTPUT"

      - name: Reset previous AI review result
        if: steps.pr.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" \
            --remove-label ai-review-passed \
            --remove-label ai-review-blocked 2>/dev/null || true

      - name: Start independent reviewer agent
        if: steps.pr.outputs.dispatch == 'true'
        env:
          COPILOT_AGENT_PAT: ${{ secrets.COPILOT_AGENT_PAT }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          test -n "$COPILOT_AGENT_PAT" || {
            echo "COPILOT_AGENT_PAT is not configured."
            exit 1
          }

          jq -n \
            --arg prompt "Independently review pull request ${PR_URL} at commit ${HEAD_SHA}. Do not change code. Submit a GitHub review with blocking findings. Apply exactly one result label: ai-review-passed only when there are no blockers and required checks pass; otherwise ai-review-blocked." \
            '{
              prompt: $prompt,
              base_ref: "main",
              head_ref: env.HEAD_REF,
              create_pull_request: false,
              custom_agent: "lingwen-reviewer"
            }' > review-task.json

          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${COPILOT_AGENT_PAT}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/agents/repos/${REPOSITORY}/tasks" \
            --data-binary @review-task.json
